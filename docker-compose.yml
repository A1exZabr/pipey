version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: pipey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipey_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pipey_db}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipey}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for queues and cache
  redis:
    image: redis:7-alpine
    container_name: pipey-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis/data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for file storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: pipey-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-pipey}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-pipey_dev_password}
    volumes:
      - ./docker/minio/data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Backend NestJS service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipey-backend
    restart: unless-stopped
    ports:
      - "3101:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-pipey}:${POSTGRES_PASSWORD:-pipey_dev_password}@postgres:5432/${POSTGRES_DB:-pipey_db}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-pipey}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-pipey_dev_password}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      FRONTEND_URL: ${HOST_URL:-http://localhost}:3100
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Frontend Next.js application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${HOST_URL:-http://localhost}:3101
    container_name: pipey-frontend
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${HOST_URL:-http://localhost}:3101
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
