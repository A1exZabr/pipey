# docker-compose.glitchtip.yml (replaces Sentry self-hosted)
# GlitchTip — lightweight, Sentry-SDK-compatible error tracking.
# Uses the same PostgreSQL and Redis from docker-compose.prod.yml.
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.sentry.yml up -d
#
# After startup:
#   1. Open http://localhost:8000, create an account
#   2. Create organization + project (NestJS / Next.js)
#   3. Copy DSN, set SENTRY_DSN in .env (works with @sentry/* SDKs)

services:
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: pipey-glitchtip
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://pipey:pipey_dev_password@postgres:5432/pipey_db
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-this-to-a-random-string-in-production}
      PORT: 8000
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      DEFAULT_FROM_EMAIL: noreply@localhost
      ENABLE_ORGANIZATION_CREATION: "true"
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: 90
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: 10000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pipey-network

  glitchtip-worker:
    image: glitchtip/glitchtip:latest
    container_name: pipey-glitchtip-worker
    restart: unless-stopped
    command: ./bin/run-celery-with-beat.sh
    environment:
      DATABASE_URL: postgresql://pipey:pipey_dev_password@postgres:5432/pipey_db
      REDIS_URL: redis://redis:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-this-to-a-random-string-in-production}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8000}
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: 90
      CELERY_WORKER_AUTOSCALE: "1,3"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: 10000
    depends_on:
      - glitchtip
    networks:
      - pipey-network

networks:
  pipey-network:
    external: true
